<div class="card-content" [class.is-selected]="selected()">
  <p class="card-title">{{ title() }}</p>

  <h2>
    {{ amount() | currency: 'INR' : 'symbol' : '1.2-2' : 'en-IN' }}
  </h2>

  <span class="status">
    {{ status() }}
  </span>

  <button class="view-details-button" type="button" (click)="onViewDetails()">View Details</button>

  <label>
    <input type="checkbox" [checked]="selected()" (change)="onSelectionChange($event)" />

    {{ selected() ? 'Selected' : 'Select Card' }}
  </label>
</div>
