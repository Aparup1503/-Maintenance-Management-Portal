<header class="app-header">
  <a class="app-brand" routerLink="/dashboard" aria-label="Maintenance Management Portal home">
    <span class="brand-mark" aria-hidden="true">M</span>
    <span>Maintenance <strong>Portal</strong></span>
  </a>

  @if (authService.isAuthenticated()) {
    <nav aria-label="Main navigation">
      <a
        routerLink="/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Dashboard
      </a>
      @if (authService.userRole() === 'Admin') {
        <a routerLink="/expenses" routerLinkActive="active">Expenses</a>
        <a routerLink="/payments" routerLinkActive="active">Payments</a>
        <a routerLink="/billing" routerLinkActive="active">Billing</a>
      }
      <button type="button" (click)="logout()">Logout</button>
    </nav>
  }
</header>

<router-outlet />
